<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/1999/REC-html401-19991224/strict.dtd">
<html>
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
		<title>Your cart information</title>
	</head>
	<body>
		<table style="font-family: Verdana,sans-serif; font-size: 11px; color: #374953; width: 550px;">
			<tbody>
				<tr>
					<td align="left">
						<a title="{shop_name}" href="{shop_url}">
							<img style="border: none;" src="{shop_logo}" alt="{shop_name}" />
						</a>
					</td>
				</tr>
				<tr>
					<td>&nbsp;</td>
				</tr>
				<tr>
					<td align="left">Hello <strong style="color: {color};">{name}</strong>,</td>
				</tr>
				<tr>
					<td>&nbsp;</td>
				</tr>
				<tr>
					<td align="left"><strong style="color: {color};">Message</strong> - {message}</td>
				</tr>
				<tr>
					<td style="padding:7px 0">
						<font size="2" face="Open-sans, sans-serif" color="#555454">
							<table class="table table-recap" bgcolor="#ffffff" style="width:100%;border-collapse:collapse"><!-- Title -->
								<thead>
									<tr>
										<th style="border:1px solid #D6D4D4;background-color:#fbfbfb;font-family:Arial;color:#333;font-size:13px;padding:10px">Product</th>
										<th style="border:1px solid #D6D4D4;background-color:#fbfbfb;font-family:Arial;color:#333;font-size:13px;padding:10px">price
										<br><small>(tax excluded)</small></th>
										<th style="border:1px solid #D6D4D4;background-color:#fbfbfb;font-family:Arial;color:#333;font-size:13px;padding:10px">Quantity</th>
										<th style="border:1px solid #D6D4D4;background-color:#fbfbfb;font-family:Arial;color:#333;font-size:13px;padding:10px">Total
										<br><small>(tax included)</small></th>
									</tr>
								</thead>
								<tbody>
									{prod_info}
								</tbody>
							</table>
						</font>
					</td>
				</tr>
				<tr>
					<td>&nbsp;</td>
				</tr>
				<tr>
					<td style="font-size: 10px; border-top: 1px solid #D9DADE;" align="center">
						<a style="color: {color}; font-weight: bold; text-decoration: none;" href="{cart}">Go Cart</a>
					</td>
				</tr>
				<tr>
					<td style="font-size: 10px; border-top: 1px solid #D9DADE;" align="center"><a style="color: {color}; font-weight: bold; text-decoration: none;" href="{shop_url}">{shop_name}</a> powered by <a style="text-decoration: none; color: #374953;" href="http://www.prestashop.com/">PrestaShop&trade;	</a>
					</td>
				</tr>
			</tbody>
		</table>
	</body>
</html>
