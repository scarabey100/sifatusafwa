<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/1999/REC-html401-19991224/strict.dtd">
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <title>[{shop_name}] Produit disponible</title>
    </head>
    <body>
        <table style="font-family: Verdana,sans-serif; font-size: 11px; color: #374953; width: 550px;">
            <tbody>
                <tr>
                    <td align="left"><a title="{shop_name}" href="{shop_url}"><img style="border: none;" src="{shop_logo}" alt="{shop_name}" /></a></td>
                </tr>
                <tr>
                    <td>&nbsp;</td>
                </tr>
                <tr>
                    <td style="background-color: #db3484; color: #fff; font-size: 12px; font-weight: bold; padding: 0.5em 1em;" align="left">{product_name} est de nouveau disponible</td>
                </tr>
                <tr>
                    <td>&nbsp;</td>
                </tr>
                <tr>
                    <td align="left">En effet, le stock a &eacute;t&eacute; r&eacute;approvisionn&eacute;.<br /><br /> Vous pouvez acc&eacute;der &agrave; la page produit en cliquant sur le lien suivant: <a href="{product_link}">{product_name}</a><br /><br /> Vous pouvez donc de nouveau commander ce produit depuis notre catalogue en ligne.</td>
                </tr>
                <tr>
                    <td>&nbsp;</td>
                </tr>
                <tr>
                    <td style="font-size: 10px; border-top: 1px solid #D9DADE;" align="center"><a style="color: #db3484; font-weight: bold; text-decoration: none;" href="{shop_url}">{shop_name}</a> propuls&eacute; par <a style="text-decoration: none; color: #374953;" href="http://www.prestashop.com/">PrestaShop&trade;</a></td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
